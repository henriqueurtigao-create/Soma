<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fluxo da Casa</title>
<meta name="theme-color" content="#1B2B4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fluxo da Casa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, mobile-first — cabeçalho fixo com o mês, conteúdo em blocos, barra de abas embaixo com botão central de lançar */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#14211D; --muted:#5B6964; --line:#D5DDD8;
  --accent:#0D6B59; --accent-ink:#FFFFFF; --accent-soft:#D4EAE3;
  --p2:#B8722A; --p2-soft:#F3E3CF;
  --good:#1D7A45; --bad:#B0281F; --warn:#A8620D;
  --shadow:0 1px 2px rgba(20,33,29,.06),0 6px 20px rgba(20,33,29,.06);
  --c-blue:#2F6BD8; --c-amber:#D4931C; --c-rust:#C0632F; --c-green:#24945F; --c-pink:#D2507F; --c-red:#D9473C; --c-purple:#7656D0; --c-teal:#1597A8; --c-save:#4A6C90;
  --cc-ink:#FFFFFF; --cc0a:#0D6B59; --cc0b:#0A3F35; --cc1a:#2F4FB0; --cc1b:#1A2A66; --cc2a:#B8722A; --cc2b:#7A3F14; --cc3a:#6B4BB5; --cc3b:#36256B;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151E1B; --surface-2:#1B2622; --ink:#E6EEEA; --muted:#93A39D; --line:#2A3833;
  --accent:#4FC3A6; --accent-ink:#06231C; --accent-soft:#173A31;
  --p2:#E0A15C; --p2-soft:#3A2A18;
  --good:#5CCB8A; --bad:#F07A70; --warn:#E6A552;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-blue:#6E9CF2; --c-amber:#EDB64F; --c-rust:#E58D5A; --c-green:#56C48E; --c-pink:#EE82AA; --c-red:#F07A70; --c-purple:#A68BF0; --c-teal:#4FC6D6; --c-save:#86A6CC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151E1B; --surface-2:#1B2622; --ink:#E6EEEA; --muted:#93A39D; --line:#2A3833;
  --accent:#4FC3A6; --accent-ink:#06231C; --accent-soft:#173A31;
  --p2:#E0A15C; --p2-soft:#3A2A18;
  --good:#5CCB8A; --bad:#F07A70; --warn:#E6A552;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-blue:#6E9CF2; --c-amber:#EDB64F; --c-rust:#E58D5A; --c-green:#56C48E; --c-pink:#EE82AA; --c-red:#F07A70; --c-purple:#A68BF0; --c-teal:#4FC6D6; --c-save:#86A6CC;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.stepper button{border:0;background:none;width:32px;height:32px;border-radius:999px;font-size:18px;line-height:1}
.stepper button:hover{background:var(--surface-2)}
.stepper span{min-width:84px;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize}

main{padding-block:16px 120px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
main>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .aux{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9vw,40px);letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px}
.hero .delta{font-size:13px;opacity:.9}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.hero-grid div{min-width:0}
.hero-grid b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-grid span{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}

.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;background:none;border:0;padding:0;text-align:left;width:100%}
.row .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:600}
.row .bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.row .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
button.row:hover .n{color:var(--accent)}

.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:4px 0 10px}
.split i:nth-child(1){background:var(--accent)} .split i:nth-child(2){background:var(--p2)} .split i:nth-child(3){background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;background:var(--accent)}
.dot.p2{background:var(--p2)} .dot.p3{background:var(--muted)}

.tx{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);font-size:14px}
.tx.rec .ico{background:var(--p2-soft);color:var(--p2)}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .val{font-weight:700;text-align:right}
.tx.rec .val{color:var(--good)}
.tx .val small{display:block;font-weight:500;color:var(--muted);font-size:11px}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.warn{color:var(--warn);border-color:currentColor;background:transparent}
.pill.bad{color:var(--bad);border-color:currentColor;background:transparent}

.acct{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.acct:first-of-type{border-top:0}
.acct .n{font-weight:600}
.acct .s{font-size:12px;color:var(--muted)}
.acct .v{font-weight:700;text-align:right}
.meter{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.steps{display:grid;gap:10px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps li.ok::before{content:"✓";background:var(--accent);color:var(--accent-ink)}
.steps{padding:0;margin:0}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.filters label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=password]{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
input:focus,select:focus{border-color:var(--accent);outline:none}

.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px;padding-top:18px}
.chart .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;gap:4px}
.chart .c i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px;opacity:.85}
.chart .c.now i{opacity:1;background:var(--p2)}
.chart .c em{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.chart .c span{font-size:11px;color:var(--muted);text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{min-width:0}
.stats b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left}
.chip b{display:block;font-size:14px}
.chip small{color:var(--muted);font-size:12px}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-block:6px}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.add span.plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:30px;line-height:1;margin-top:-22px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,18,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.valor{font-family:var(--f-display);font-size:30px!important;font-weight:700;padding:10px 12px!important}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.banner{background:var(--p2-soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.item-list{display:grid;gap:0}

/* Painel inicial */
.greet{padding:4px 2px 2px}
.greet h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7.5vw,32px);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.greet p{margin:0;font-size:16.5px;line-height:1.5;color:var(--muted);max-width:34em}
.greet p b{color:var(--ink);font-weight:700}
.greet b.up{color:var(--bad)} .greet b.down{color:var(--good)}
.ringcard{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.ring{width:140px;height:140px;max-width:100%}
.ring circle{transition:stroke-dasharray .5s ease}
.r-lab{font-size:10.5px;fill:var(--muted);font-family:var(--f-body)}
.r-big{font-size:26px;font-weight:700;fill:var(--ink);font-family:var(--f-display)}
.rleg{display:grid;gap:10px;min-width:0}
.rleg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:14px}
.rleg i{width:12px;height:12px;border-radius:4px;display:block}
.rleg span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rleg b{font-weight:700}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{text-align:left;display:grid;gap:2px;padding:14px}
.mcard b{font-family:var(--f-display);font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard small{color:var(--muted);font-size:12px}
.mcard:hover{border-color:var(--accent)}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.sec-t h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px}
.ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:grid;gap:6px;min-width:0;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.tile:hover{border-color:var(--c);transform:translateY(-1px)}
.tile .tn{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.tile b{font-family:var(--f-display);font-size:20px;font-weight:700}
.tbar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--c);border-radius:3px}
.tile small{font-size:11.5px;color:var(--muted)}
.ccards{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cc{flex:none;width:250px;max-width:80vw;aspect-ratio:1.6;border:0;border-radius:18px;padding:16px;color:var(--cc-ink);text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;scroll-snap-align:start;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.cc::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-70px;background:rgba(255,255,255,.12)}
.cc0{background:linear-gradient(135deg,var(--cc0a),var(--cc0b))} .cc1{background:linear-gradient(135deg,var(--cc1a),var(--cc1b))}
.cc2{background:linear-gradient(135deg,var(--cc2a),var(--cc2b))} .cc3{background:linear-gradient(135deg,var(--cc3a),var(--cc3b))}
.cc-n{font-weight:700;font-size:15px;position:relative;z-index:1}
.cc-chip{position:absolute;right:16px;top:16px;width:30px;height:22px;border-radius:5px;background:rgba(255,255,255,.35);z-index:1}
.cc-v{font-family:var(--f-display);font-size:24px;font-weight:700;position:relative;z-index:1;line-height:1.15}
.cc-v small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.cc-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;position:relative;z-index:1}
.cc-bar i{display:block;height:100%;background:var(--cc-ink)}
.cc-f{display:flex;justify-content:space-between;font-size:12px;opacity:.9;position:relative;z-index:1}
.dicas{display:grid;gap:12px}
.dica{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.dica p{margin:0;font-size:14.5px;color:var(--muted)}
.dica p b{color:var(--ink)}
.tx .ic{width:36px;height:36px}
@media (max-width:380px){.ringcard{grid-template-columns:1fr;justify-items:center}.rleg{width:100%}}

/* Alertas, atalhos, contas fixas */
.alerts{display:grid;gap:8px}
.alert{--c:var(--warn);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:14px;padding:12px 14px}
.alert.bad{--c:var(--bad)} .alert.good{--c:var(--good)}
.alert .at{min-width:0} .alert .at b{display:block;font-weight:700;line-height:1.3} .alert .at small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.alert .go{color:var(--c);font-size:24px;line-height:1}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qk{display:grid;justify-items:center;align-content:start;gap:7px;padding:12px 4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:12px;font-weight:600;box-shadow:var(--shadow);min-width:0}
.qk>span:last-child{text-align:center;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  if(!c || c.tipo!=='cartao' || !c.fechamento) return l.data.slice(0,7);
  const dia = +l.data.slice(8,10);
  return dia > c.fechamento ? addMes(l.data.slice(0,7),1) : l.data.slice(0,7);
}

/* ---------- Render ---------- */
const $view = document.getElementById('view');
function render(){
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const per = document.getElementById('period'), step=document.getElementById('stepper');
  step.hidden = !(S.tab==='inicio'||S.tab==='relatorios');
  if(S.tab==='inicio'){const [y,m]=S.mes.split('-');per.textContent=`${MES[+m-1]} ${y}`}
  if(S.tab==='relatorios') per.textContent=String(S.f.ano);
  document.getElementById('who').textContent = S.uid ? `${meuNome()||'Você'} · ${podeLancar()?'pode lançar':'só acompanha'}` : 'Finanças da família';
  document.getElementById('addBtn').style.visibility = (!db||podeLancar()) ? '' : 'hidden';
  let html='';
  if(!db && S.ready) html += `<div class="banner">Sem conexão com o banco de dados. Verifique a internet.</div>`;
  if(S.err) html += `<div class="banner">Não foi possível carregar os dados (${esc(S.err)}). Recarregue a página.</div>`;
  else if(S.slow) html += `<div class="banner">Sem conexão com o servidor. Você vê os dados salvos neste aparelho e o que lançar sincroniza quando a internet voltar.</div>`;
  html += ({inicio:vInicio,relatorios:vRelatorios,contas:vContas,familia:vAjustes}[S.tab])();
  $view.innerHTML = html;
}

function loading(){return !S.loaded.lanc && !S.slow && !S.err && db}

function vInicio(){
  if(loading()) return `<div class="card"><p class="muted">Carregando lançamentos…</p></div>`;
  const M=S.mes, P=addMes(M,-1), nomeMes=MES_LONGO[+M.slice(5)-1];
  const desp=S.lanc.filter(l=>l.tipo==='despesa');
  const doMes=desp.filter(l=>l.data.slice(0,7)===M);
  const gastos=doMes.filter(l=>!ehGuarda(l)), guard=doMes.filter(ehGuarda);
  const tG=sum(gastos), tGuard=sum(guard), tR=sum(S.lanc.filter(l=>l.tipo==='receita'&&l.data.slice(0,7)===M));
  const tPrev=sum(desp.filter(l=>l.data.slice(0,7)===P&&!ehGuarda(l)));
  const fx=sum(gastos.filter(l=>l.natureza==='fixa')), vr=Math.round((tG-fx)*100)/100;
  const sobra=Math.round((tR-tG-tGuard)*100)/100;
  const hora=new Date().getHours(), saud=hora<12?'Bom dia':hora<18?'Boa tarde':'Boa noite';
  const primeiro=meuNome();
  const hoje=hojeISO(), atual=M===hoje.slice(0,7), dia=+hoje.slice(8,10), dim=diasNoMes(+M.slice(0,4),+M.slice(5));

  // Frase-resumo
  let frase;
  if(!doMes.length) frase=`Nenhuma despesa lançada em ${nomeMes} ainda. Toque no <b>+</b> para começar.`;
  else{
    frase=`Em ${nomeMes} a família ${atual?'já gastou':'gastou'} <b>${brl0(tG)}</b>`;
    if(tPrev>0){const p=(tG-tPrev)/tPrev*100;frase+= Math.abs(p)<3?`, praticamente o mesmo que em ${MES_LONGO[+P.slice(5)-1]}.`:`, <b class="${p>0?'up':'down'}">${Math.abs(p).toFixed(0)}% ${p>0?'a mais':'a menos'}</b> que em ${MES_LONGO[+P.slice(5)-1]}.`}
    else frase+='.';
    if(tR>0) frase+= sobra>=0?` Das receitas, ainda sobram <b class="down">${brl0(sobra)}</b>.`:` As despesas passaram as receitas em <b class="up">${brl0(-sobra)}</b>.`;
  }
  let h=`<section class="greet"><h1>${saud}${primeiro?', '+esc(primeiro):''}</h1><p>${frase}</p></section>`;
  if(!S.lanc.length && !S.contas.length) h+=setupCard();
  const bancos=S.contas.filter(c=>c.tipo==='banco'), cartoes=S.contas.filter(c=>c.tipo==='cartao');
  const fixas=fixasDoMes(M), pend=fixas.filter(f=>!f.qtd);

  // Alertas (só no mês atual)
  if(atual){
    const al=[];
    cartoes.filter(c=>c.vencimento).forEach(c=>{const v=proxVenc(c),val=faturaDe(c,v.comp);
      if(v.dias<=5&&val>0) al.push({n:v.dias<=2?'bad':'warn',ic:'card',t:`Fatura ${c.nome} vence ${v.dias===0?'hoje':v.dias===1?'amanhã':'em '+v.dias+' dias'}`,s:`${brl(val)} · dia ${v.dia}`,act:'verConta',id:c.id})});
    cartoes.filter(c=>c.limite).forEach(c=>{const val=faturaDe(c,compAberta(c)),p=val/c.limite;
      if(p>=.8) al.push({n:p>=1?'bad':'warn',ic:'card',t:`${c.nome} usou ${(p*100).toFixed(0)}% do limite`,s:`${brl0(val)} de ${brl0(c.limite)} na fatura aberta`,act:'verConta',id:c.id})});
    Object.entries(S.tetos||{}).forEach(([cid,teto])=>{if(!(teto>0)||!catById(cid))return;const v=sum(gastos.filter(l=>l.cat===cid)),p=v/teto;
      if(p>=.9) al.push({n:p>=1?'bad':'warn',ic:cid,t:`${catById(cid).nome}: ${(p*100).toFixed(0)}% do teto`,s:`${brl0(v)} de ${brl0(teto)} em ${nomeMes}`,act:'verCat',cat:cid})});
    const atras=pend.filter(f=>f.ult&&dia>f.dia+2);
    atras.slice(0,3).forEach(f=>al.push({n:'warn',ic:f.cat,t:`${rotFixa(f)} ainda não foi lançada`,s:`Em ${MES_LONGO[+f.ult.data.slice(5,7)-1]}: ${brl0(f.ult.valor)}, dia ${f.dia}`,act:'fixa',key:f.key}));
    if(atras.length>3) al.push({n:'warn',ic:'outros',t:`Mais ${atras.length-3} contas fixas pendentes`,s:'Veja a lista de contas fixas abaixo',act:'scrollFixas'});
    if(dia>=10&&gastos.length){const proj=fx+vr/dia*dim;
      if(tPrev>0&&proj>tPrev*1.1) al.push({n:'warn',ic:'investimentos',t:`No ritmo atual, ${nomeMes} fecha em ${brl0(proj)}`,s:`${((proj/tPrev-1)*100).toFixed(0)}% acima de ${MES_LONGO[+P.slice(5)-1]} (${brl0(tPrev)})`,act:'verMes'});
      else if(tR>0&&proj+tGuard>tR) al.push({n:'bad',ic:'investimentos',t:'No ritmo atual, os gastos passam a renda',s:`Projeção de ${brl0(proj+tGuard)} para ${brl0(tR)} de receitas`,act:'verMes'});}
    al.sort((a,b)=>(b.n==='bad')-(a.n==='bad'));
    const extra=al.length-3, vis=S.verAlertas?al:al.slice(0,3);
    if(al.length) h+=`<section class="alerts" aria-label="Alertas">${vis.map(a=>`<button class="alert ${a.n}" data-act="${a.act}"${a.id?` data-id="${a.id}"`:''}${a.cat?` data-cat="${a.cat}"`:''}${a.key?` data-key="${esc(a.key)}"`:''}><span class="ic"><svg viewBox="0 0 24 24">${ICO[a.ic]||ICO.outros}</svg></span><span class="at"><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span><span class="go">›</span></button>`).join('')}${extra>0?`<button class="lnk" data-act="maisAlertas">${S.verAlertas?'Mostrar menos':`Ver mais ${extra} alerta${extra>1?'s':''}`}</button>`:''}</section>`;
    else if(S.lanc.length) h+=`<section class="alerts"><div class="alert good"><span class="ic"><svg viewBox="0 0 24 24">${ICO.reserva}</svg></span><span class="at"><b>Tudo em dia</b><small>Nenhuma fatura vencendo, limite estourado ou conta fixa atrasada.</small></span></div></section>`;
  }

  // Atalhos
  if(podeLancar()){
    const lim=addMesData(hoje,-3), cnt=new Map();
    S.lanc.filter(l=>l.tipo==='despesa'&&l.data>=lim&&(!S.uid||l.autor===S.uid)).forEach(l=>{const k=l.cat+'|'+l.sub;cnt.set(k,(cnt.get(k)||0)+1)});
    let at=[...cnt].sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(k=>catById(k.split('|')[0]));
    for(const d of ['alimentacao|Supermercado','veiculos|Combustível','alimentacao|Restaurante','saude|Farmácia']) if(!at.includes(d)) at.push(d);
    h+=`<section><div class="sec-t"><h2>Lançar rápido</h2></div><div class="quick">${at.slice(0,4).map(k=>{const [c,sb]=k.split('|');return `<button class="qk" data-act="atalho" data-cat="${c}" data-sub="${esc(sb)}">${icone(c)}<span>${esc(sb)}</span></button>`}).join('')}</div></section>`;
  }

  // Rosca
  if(doMes.length||tR){
    const base=Math.max(tR,tG+tGuard)||1, C=2*Math.PI*52;
    const segs=[[fx,'var(--accent)'],[vr,'var(--p2)'],[tGuard,'var(--c-save)']];
    let off=0; const arcs=segs.map(([v,c])=>{const len=v/base*C;const el=v>0?`<circle r="52" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`:'';off+=len;return el}).join('');
    const usado=tR>0?Math.min(999,(tG+tGuard)/tR*100):null;
    h+=`<section class="card ringcard">
      <svg viewBox="0 0 140 140" class="ring" aria-label="Composição do mês"><g transform="rotate(-90 70 70)"><circle r="52" cx="70" cy="70" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${arcs}</g>
        <text x="70" y="64" text-anchor="middle" class="r-lab">${tR>0?'renda usada':'total do mês'}</text>
        <text x="70" y="86" text-anchor="middle" class="r-big">${tR>0?usado.toFixed(0)+'%':compacto(tG+tGuard)}</text></svg>
      <div class="rleg">
        <div><i style="background:var(--accent)"></i><span>Contas fixas</span><b>${brl0(fx)}</b></div>
        <div><i style="background:var(--p2)"></i><span>Dia a dia</span><b>${brl0(vr)}</b></div>
        <div><i style="background:var(--c-save)"></i><span>Guardado</span><b>${brl0(tGuard)}</b></div>
        ${tR>0?`<div><i style="background:var(--surface-2);border:1px solid var(--line)"></i><span>Sobra</span><b>${brl0(Math.max(sobra,0))}</b></div>`:''}
      </div></section>`;
  }

  // Saldo e faturas
  const fat=c=>sum(S.lanc.filter(l=>l.conta===c.id&&l.tipo==='despesa'&&mesFatura(l)===M));
  if(bancos.length||cartoes.length){
    h+=`<section class="mini">
      <button class="card mcard" data-act="tab" data-tab="contas"><span class="label">Saldo nos bancos</span><b>${brl0(bancos.reduce((a,c)=>a+(c.saldo||0),0))}</b><small>${bancos.length} conta${bancos.length!==1?'s':''}</small></button>
      <button class="card mcard" data-act="tab" data-tab="contas"><span class="label">Faturas do mês</span><b>${brl0(cartoes.reduce((a,c)=>a+fat(c),0))}</b><small>${cartoes.length} ${cartoes.length!==1?'cartões':'cartão'}</small></button></section>`;
  }

  // Contas fixas
  if(fixas.length){
    const feitas=fixas.length-pend.length;
    h+=`<section class="card" id="fixas"><h2>Contas fixas de ${nomeMes} <span class="aux">${feitas} de ${fixas.length} lançadas</span></h2>
      <div class="prog"><i style="width:${(feitas/fixas.length*100).toFixed(1)}%"></i></div>
      <div>${fixas.map(f=>`<div class="fx ${f.qtd?'ok':''}"><span class="ck">${f.qtd?'✓':''}</span>
        <span class="fx-n"><b>${esc(rotFixa(f))}</b><small>${f.qtd?'Lançada · '+brl(f.pago):`Último: ${brl(f.ult.valor)} · costuma ser dia ${f.dia}`}</small></span>
        ${!f.qtd&&podeLancar()?`<button class="btn small" data-act="fixa" data-key="${esc(f.key)}">Lançar</button>`:''}</div>`).join('')}</div></section>`;
  }

  // Categorias
  if(gastos.length){
    const porCat=agrupa(gastos,l=>l.cat);
    h+=`<section><div class="sec-t"><h2>Para onde foi o dinheiro</h2><button class="lnk" data-act="verMes">ver tudo</button></div>
      <div class="tiles">${porCat.slice(0,6).map(([c,v])=>`<button class="tile" data-act="verCat" data-cat="${c}" style="--c:${COR[c]||'var(--muted)'}">
        ${icone(c)}<span class="tn">${esc(catById(c)?.nome||c)}</span><b>${brl0(v)}</b>
        ${S.tetos?.[c]>0?`<span class="tbar"><i class="${v>S.tetos[c]?'over':''}" style="width:${Math.min(v/S.tetos[c]*100,100).toFixed(1)}%"></i></span><small>${(v/S.tetos[c]*100).toFixed(0)}% do teto de ${brl0(S.tetos[c])}</small>`:`<span class="tbar"><i style="width:${(v/tG*100).toFixed(1)}%"></i></span><small>${(v/tG*100).toFixed(0)}% dos gastos</small>`}</button>`).join('')}</div></section>`;
  }

  // Cartões
  if(cartoes.length){
    h+=`<section><div class="sec-t"><h2>Cartões</h2><button class="lnk" data-act="tab" data-tab="contas">gerenciar</button></div><div class="ccards">${cartoes.map((c,i)=>{
      const f=fat(c), pct=c.limite?Math.min(f/c.limite*100,100):0;
      return `<button class="cc cc${i%4}" data-act="editConta" data-id="${c.id}"><span class="cc-n">${esc(c.nome)}</span><span class="cc-chip"></span>
        <span class="cc-v"><small>fatura de ${MES[+M.slice(5)-1]}</small>${brl(f)}</span>
        ${c.limite?`<span class="cc-bar"><i style="width:${pct.toFixed(1)}%"></i></span>`:''}
        <span class="cc-f">${c.titular?esc(c.titular):''}<span>${c.vencimento?'vence dia '+c.vencimento:''}</span></span></button>`}).join('')}</div></section>`;
  }

  // Dicas
  const dicas=[];
  if(gastos.length){
    const porCat=agrupa(gastos,l=>l.cat);
    dicas.push([porCat[0][0],`<b>${esc(catById(porCat[0][0])?.nome)}</b> foi o maior gasto do mês: ${brl0(porCat[0][1])}.`]);
    if(tG>0) dicas.push(['casa_fixas',`As contas fixas levam <b>${(fx/tG*100).toFixed(0)}%</b> do que vocês gastam.`]);
    const porItem=agrupa(gastos.filter(l=>l.item),l=>l.item);
    if(porItem.length){const it=S.itens.find(i=>i.id===porItem[0][0]);if(it)dicas.push([it.cat,`<b>${esc(it.nome)}</b> custou ${brl0(porItem[0][1])} neste mês.`])}
    const porAutor=agrupa(gastos,l=>l.autor||'');
    if(porAutor.length>1) dicas.push(['pessoal',porAutor.map(([a,v])=>`${esc(nomePessoa(a))} lançou <b>${brl0(v)}</b>`).join(' e ')+'.']);
  }
    if(dicas.length) h+=`<section class="card"><h2>Resumo rápido</h2><div class="dicas">${dicas.map(([c,t])=>`<div class="dica" style="--c:${COR[c]||'var(--muted)'}">${icone(c)}<p>${t}</p></div>`).join('')}</div></section>`;

  // Últimos
  const ult=S.lanc.filter(l=>l.data.slice(0,7)===M).sort(ordData).slice(0,5);
  if(ult.length) h+=`<section><div class="sec-t"><h2>Últimos lançamentos</h2><button class="lnk" data-act="verMes">ver todos</button></div><div class="card" style="padding-block:4px">${ult.map(txRow).join('')}</div></section>`;
  return h;
}

const diasNoMes=(y,m)=>new Date(y,m,0).getDate();
const faturaDe=(c,comp)=>sum(S.lanc.filter(l=>l.conta===c.id&&l.tipo==='despesa'&&mesFatura(l)===comp));
function compAberta(c){const h=hojeISO();return (c.fechamento&&+h.slice(8)>c.fechamento)?addMes(h.slice(0,7),1):h.slice(0,7)}
function proxVenc(c){
  const t=new Date();t.setHours(0,0,0,0);
  let d=new Date(t.getFullYear(),t.getMonth(),Math.min(c.vencimento,diasNoMes(t.getFullYear(),t.getMonth()+1)));
  if(d<t) d=new Date(t.getFullYear(),t.getMonth()+1,Math.min(c.vencimento,diasNoMes(t.getFullYear(),t.getMonth()+2)));
  const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  return {dias:Math.round((d-t)/864e5),dia:d.getDate(),comp:(c.fechamento&&c.vencimento>c.fechamento)?ym:addMes(ym,-1)};
}
function fixasDoMes(M){
  const prevs=new Set([addMes(M,-1),addMes(M,-2),addMes(M,-3)]), map=new Map();
  S.lanc.filter(l=>l.tipo==='despesa'&&l.natureza==='fixa'&&!l.grupo).forEach(l=>{
    const ym=l.data.slice(0,7), key=l.cat+'|'+l.sub+'|'+(l.item||'');
    if(!map.has(key)) map.set(key,{key,cat:l.cat,sub:l.sub,item:l.item||'',ult:null,pago:0,qtd:0});
    const e=map.get(key);
    if(ym===M){e.pago+=l.valor;e.qtd++}
    else if(prevs.has(ym)&&(!e.ult||l.data>e.ult.data)) e.ult=l;
  });
  return [...map.values()].filter(e=>e.qtd||e.ult).map(e=>({...e,dia:e.ult?+e.ult.data.slice(8,10):0})).sort((a,b)=>(!!a.qtd-!!b.qtd)||a.dia-b.dia);
}
function rotFixa(f){const it=S.itens.find(i=>i.id===f.item);return f.sub+(it?' · '+it.nome:'')}

function setupCard(){
  const temConta=S.contas.length>0, temItem=S.itens.length>0, temLanc=S.lanc.length>0;
  return `<section class="card"><h2>Primeiros passos</h2><ol class="steps">
    <li class="${temConta?'ok':''}"><div><b>Cadastre bancos e cartões</b><br><span class="muted">Na aba Contas: saldo de cada banco, limite e dia de fechamento de cada cartão.</span></div></li>
    <li class="${temItem?'ok':''}"><div><b>Cadastre os veículos e os filhos</b><br><span class="muted">Na aba Família. Assim cada despesa fica ligada ao carro ou ao filho certo.</span></div></li>
    <li class="${temLanc?'ok':''}"><div><b>Lance a primeira despesa</b><br><span class="muted">Toque em + . A Ana Paula lança as dela no mesmo app e tudo soma junto.</span></div></li>
  </ol></section>`;
}

function txRow(l){
  const c=catById(l.cat), it=S.itens.find(i=>i.id===l.item), ct=contaById(l.conta);
  const det=[l.sub, it?.nome, ct?.nome||'Pix/dinheiro', nomePessoa(l.autor)].filter(Boolean).join(' · ');
  return `<button class="tx ${l.tipo==='receita'?'rec':''}" data-act="editLanc" data-id="${l.id}">
    ${icone(l.cat)}
    <span class="t"><b>${esc(l.desc||l.sub||c?.nome)}</b><small>${esc(det)}</small></span>
    <span class="val">${l.tipo==='receita'?'+':''}${brl(l.valor)}<small>${dataBR(l.data)}${l.natureza==='fixa'?' · fixa':''}</small></span></button>`;
}

function vRelatorios(){
  if(loading()) return `<div class="card"><p class="muted">Carregando…</p></div>`;
  const f=S.f, ano=String(f.ano);
  const cat=catById(f.cat);
  const lista=filtrados();
  const total=sum(lista);
  const meses=Array(12).fill(0); lista.forEach(l=>meses[+l.data.slice(5,7)-1]+=l.valor);
  const agora=hojeISO();
  const nMeses = ano===agora.slice(0,4) ? +agora.slice(5,7) : 12;
  const max=Math.max(...meses,1);
  const autores=[...new Set(S.lanc.map(l=>l.autor).filter(Boolean))];
  const itensCat = cat?.itens ? S.itens.filter(i=>i.cat===cat.id) : [];
  const catsLista = f.tipo==='receita'?[RECEITAS]:CATS;

  let h=`<section class="card"><h2>Filtros <button class="btn small" data-act="limpar">Limpar</button></h2><div class="filters">
    <label>Tipo<select id="f_tipo"><option value="despesa" ${f.tipo==='despesa'?'selected':''}>Despesas</option><option value="receita" ${f.tipo==='receita'?'selected':''}>Receitas</option></select></label>
    <label>Categoria<select id="f_cat"><option value="">Todas</option>${catsLista.map(c=>`<option value="${c.id}" ${f.cat===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
    <label>Subcategoria<select id="f_sub" ${cat?'':'disabled'}><option value="">Todas</option>${(cat?.subs||[]).map(s=>`<option ${f.sub===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
    ${itensCat.length?`<label>${cat.itens[0].toUpperCase()+cat.itens.slice(1)}<select id="f_item"><option value="">Todos</option>${itensCat.map(i=>`<option value="${i.id}" ${f.item===i.id?'selected':''}>${esc(i.nome)}</option>`).join('')}</select></label>`:''}
    <label>Quem lançou<select id="f_autor"><option value="">Todos</option>${autores.map(a=>`<option value="${a}" ${f.autor===a?'selected':''}>${esc(nomePessoa(a))}</option>`).join('')}</select></label>
    <label>Conta ou cartão<select id="f_conta"><option value="">Todas</option><option value="_avista" ${f.conta==='_avista'?'selected':''}>Pix/dinheiro</option>${S.contas.map(c=>`<option value="${c.id}" ${f.conta===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
  </div></section>`;

  if(itensCat.length){
    const doAno=S.lanc.filter(l=>l.tipo==='despesa'&&l.cat===cat.id&&l.data.startsWith(ano));
    h+=`<div class="chips">${itensCat.map(i=>`<button class="chip ${f.item===i.id?'on':''}" data-act="chipItem" data-id="${i.id}"><b>${esc(i.nome)}</b><small>${brl0(sum(doAno.filter(l=>l.item===i.id)))} em ${ano}</small></button>`).join('')}</div>`;
  }

  const titulo=[cat?.nome||(f.tipo==='receita'?'Todas as receitas':'Todas as despesas'), f.sub, S.itens.find(i=>i.id===f.item)?.nome].filter(Boolean).join(' · ');
  h+=`<section class="card"><h2>${esc(titulo)} <span class="aux">${ano}</span></h2>
    <div class="stats"><div><span class="label">Total no ano</span><b>${brl0(total)}</b></div>
    <div><span class="label">Média/mês</span><b>${brl0(total/nMeses)}</b></div>
    <div><span class="label">Lançamentos</span><b>${lista.length}</b></div></div>
    <div class="chart">${meses.map((v,i)=>`<div class="c ${ano+'-'+pad(i+1)===agora.slice(0,7)?'now':''}" title="${MES_LONGO[i]}: ${brl(v)}"><em>${v?compacto(v):''}</em><i style="height:${(v/max*100).toFixed(1)}%"></i><span>${MES[i][0]}</span></div>`).join('')}</div></section>`;

  if(lista.length){
    const quebra = cat ? agrupa(lista,l=>l.sub||'—') : agrupa(lista,l=>l.cat);
    const mx=quebra[0][1];
    h+=`<section class="card"><h2>${cat?'Por subcategoria':'Por categoria'}</h2><div class="rows">${quebra.map(([k,v])=>`<div class="row"><span class="n">${esc(cat?k:(catById(k)?.nome||k))}</span><span class="v">${brl(v)}</span><span class="bar"><i style="width:${(v/mx*100).toFixed(1)}%"></i></span><span class="sub">${(v/total*100).toFixed(0)}%</span></div>`).join('')}</div></section>`;
  }

  const ord=[...lista].sort(ordData);
  h+=`<section class="card"><h2>Lançamentos <span class="aux">${lista.length}</span></h2>`;
  h+= ord.length ? ord.slice(0,200).map(txRow).join('') + (ord.length>200?`<p class="hint">Mostrando os 200 mais recentes. Use os filtros para refinar.</p>`:'') : `<p class="empty">Nenhum lançamento com esses filtros em ${ano}.</p>`;
  if(ord.length && downloads) h+=`<button class="btn small" data-act="csv" style="margin-top:10px">Exportar planilha (CSV)</button>`;
  h+=`</section>`;
  return h;
}

function filtrados(){
  const f=S.f, ano=String(f.ano);
  return S.lanc.filter(l=>l.tipo===f.tipo && l.data.startsWith(ano)
    && (!f.cat||l.cat===f.cat) && (!f.sub||l.sub===f.sub) && (!f.item||l.item===f.item)
    && (!f.autor||l.autor===f.autor) && (!f.conta||(f.conta==='_avista'?!l.conta:l.conta===f.conta)));
}

function vContas(){
  const bancos=S.contas.filter(c=>c.tipo==='banco'), cartoes=S.contas.filter(c=>c.tipo==='cartao');
  const M=hojeISO().slice(0,7);
  let h=`<section class="card"><h2>Bancos <span class="aux">${brl(bancos.reduce((a,c)=>a+(c.saldo||0),0))}</span></h2>`;
  h+= bancos.length ? bancos.map(b=>`<button class="acct" data-act="editConta" data-id="${b.id}"><span><span class="n">${esc(b.nome)}</span><br><span class="s">${b.titular?esc(b.titular)+' · ':''}atualizado ${b.atualizado?dataBR(b.atualizado):'—'}</span></span><span class="v">${brl(b.saldo)}</span></button>`).join('') : `<p class="empty">Nenhum banco cadastrado.</p>`;
  h+=`<p class="hint">Toque no banco para atualizar o saldo quando conferir o extrato.</p>
    <button class="btn block" data-act="novaConta" data-tipo="banco" style="margin-top:6px">Adicionar banco</button></section>`;
  h+=`<section class="card"><h2>Cartões <span class="aux">fatura atual</span></h2>`;
  h+= cartoes.length ? cartoes.map(c=>{const f=sum(S.lanc.filter(l=>l.conta===c.id&&l.tipo==='despesa'&&mesFatura(l)===M));const pct=c.limite?f/c.limite*100:0;const cls=pct>=90?'bad':pct>=70?'warn':'';
    return `<button class="acct" data-act="editConta" data-id="${c.id}"><span><span class="n">${esc(c.nome)}</span><br><span class="s">${c.titular?esc(c.titular)+' · ':''}fecha dia ${c.fechamento||'—'} · vence dia ${c.vencimento||'—'}</span></span><span class="v">${brl(f)}${c.limite?`<br><span class="s">de ${brl0(c.limite)}</span>`:''}</span>${c.limite?`<span class="meter"><i class="${cls}" style="width:${Math.min(pct,100).toFixed(1)}%"></i></span>`:''}</button>`}).join('') : `<p class="empty">Nenhum cartão cadastrado.</p>`;
  h+=`<p class="hint">Compras depois do dia de fechamento entram na fatura do mês seguinte.</p>
    <button class="btn block" data-act="novaConta" data-tipo="cartao" style="margin-top:6px">Adicionar cartão</button></section>`;
  return h;
}

      ${S.isOwner&&!eu?`<span class="btnrow" style="justify-content:flex-end"><select id="papel_${encodeURIComponent(em)}" aria-label="Permissão"><option value="lanca" ${!ve?'selected':''}>Lança</option><option value="ve" ${ve?'selected':''}>Só vê</option></select><button class="btn small danger" data-act="remover" data-em="${esc(em)}">Remover</button></span>`:''}</div>`}).join('')}</div>
    ${S.isOwner?`<div class="stack" style="margin-top:12px"><label class="field"><span>Liberar acesso para</span><input type="email" id="novo_email" placeholder="e-mail da pessoa" autocomplete="off"></label><button class="btn primary" data-act="liberar">Liberar acesso</button><p class="hint" style="margin:0">Depois de liberar, mande o link do app. A pessoa toca em "Criar conta" com esse e-mail e escolhe a própria senha.</p></div>`:'<p class="hint">Só o administrador libera novos acessos.</p>'}</section>`;

  h+=`<section class="card"><h2>Cores do app <span class="aux">vale só para você</span></h2><div class="pals">${PALS.map(([k,n,c1,c2])=>`<button class="pal ${pal===k?'on':''}" data-act="setPal" data-pal="${k}"><span class="pal-sw" style="background:linear-gradient(135deg,${c1} 50%,${c2} 50%)"></span>${n}</button>`).join('')}</div></section>`;

  const temPin=!!S.prefs?.pin;
  h+=`<section class="card"><h2>PIN de acesso <span class="aux">${temPin?'ativo':'desativado'}</span></h2>
    <p class="muted" style="margin:0 0 12px">${temPin?'O app pede o PIN ao abrir e depois de 5 minutos fora.':'Trave o app com 4 números, útil no celular que as crianças pegam.'} O PIN é uma trava de tela: os dados continuam protegidos pela sua conta.</p>

  const tt=Object.entries(S.tetos||{}).filter(([c,v])=>v>0&&catById(c));

    <button class="btn block" data-act="tetos">${tt.length?'Alterar tetos':'Definir tetos'}</button></section>`;

  for(const cid of ['veiculos','filhos']){
    const c=catById(cid), its=S.itens.filter(i=>i.cat===cid);

    h+= its.length ? `<div class="item-list">${its.map(i=>{const v=sum(S.lanc.filter(l=>l.tipo==='despesa'&&l.item===i.id&&l.data.startsWith(ano)));
      return `<div class="acct"><span><span class="n">${esc(i.nome)}</span><br><span class="s">${esc(i.obs||'')}</span></span><span class="v">${brl(v)}<br><span class="btnrow" style="justify-content:flex-end;margin-top:4px"><button class="btn small" data-act="verItem" data-cat="${cid}" data-id="${i.id}">Relatório</button><button class="btn small" data-act="editItem" data-id="${i.id}">Editar</button></span></span></div>`}).join('')}</div>` : `<p class="empty">Nenhum ${c.itens} cadastrado.</p>`;
    h+=`<button class="btn block" data-act="novoItem" data-cat="${cid}" style="margin-top:6px">Adicionar ${c.itens}</button></section>`;
  }
  return h;
}

/* ---------- Cálculos ---------- */
function sum(arr){return Math.round(arr.reduce((a,l)=>a+(l.valor||0),0)*100)/100}
function agrupa(arr,key){const m=new Map();arr.forEach(l=>{const k=key(l);m.set(k,(m.get(k)||0)+(l.valor||0))});return [...m].sort((a,b)=>b[1]-a[1])}
function ordData(a,b){return b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0)}

/* ---------- Folhas (formulários) ---------- */
const $sheet=document.getElementById('sheetRoot');
function abrir(html,wire){
  $sheet.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById('bg').addEventListener('click',e=>{if(e.target.id==='bg'||e.target.closest('[data-close]'))fechar()});
  wire&&wire($sheet.querySelector('.sheet'));
}
function fechar(){$sheet.innerHTML=''}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2600)}

function erroEscrita(e){
  if(e?.code==='invalid_argument'||e?.code==='permission-denied'){S.canWrite=false;render();toast('Sem permissão para salvar. Peça ao administrador para liberar seu acesso.')}
  else if(e?.code==='quota_exceeded') toast('Limite de armazenamento atingido.');
  else toast('Não foi possível salvar. Tente de novo.');
}
function podeSalvar(){if(!db){toast('Entre na sua conta para salvar.');return false}if(!S.canWrite){toast('Você está em modo somente leitura.');return false}return true}

function formLanc(l,preset){
  const novo=!l; const ultimo=lsGet('cf_ultconta')||'';
  const d=l?{...l}:{tipo:'despesa',valor:0,data:hojeISO(),desc:'',cat:'alimentacao',sub:'Supermercado',item:'',conta:ultimo,natureza:'variavel',...(preset||{})};
  abrir(`<h3>${novo?'Novo lançamento':'Editar lançamento'}<button data-close aria-label="Fechar">×</button></h3>
    <div class="seg" id="s_tipo"><button data-v="despesa">Despesa</button><button data-v="receita">Receita</button></div>
    <label class="field"><span>Valor (R$)</span><input type="text" inputmode="decimal" id="l_valor" class="valor" placeholder="0,00" value="${valorInput(d.valor)}"></label>
    <div class="two"><label class="field"><span>Data</span><input type="date" id="l_data" value="${d.data}"></label>
      <label class="field"><span>Pago com</span><select id="l_conta"></select></label></div>
    <label class="field"><span>Categoria</span><select id="l_cat"></select></label>
    <div class="two"><label class="field"><span>Subcategoria</span><select id="l_sub"></select></label>
      <label class="field" id="w_item"><span id="l_itemlbl">Item</span><select id="l_item"></select></label></div>
    <label class="field"><span>Descrição (opcional)</span><input type="text" id="l_desc" maxlength="80" placeholder="Ex.: troca de óleo, mensalidade" value="${esc(d.desc)}"></label>
    <div class="two"><div class="field"><span>Natureza</span><div class="seg" id="s_nat"><button data-v="fixa">Fixa</button><button data-v="variavel">Variável</button></div></div>
      <label class="field" id="w_parc"><span>Parcelas</span><input type="number" id="l_parc" min="1" max="36" value="1"></label></div>
    <p class="hint" id="h_parc"></p>
    <button class="btn primary block" id="l_save">${novo?'Salvar lançamento':'Salvar alterações'}</button>
    ${novo?'':`<div class="btnrow"><button class="btn danger" id="l_del">Excluir</button>${d.grupo?'<button class="btn danger" id="l_delg">Excluir todas as parcelas</button>':''}</div>`}`,
  el=>{
    const q=s=>el.querySelector(s);
    const seg=(id,val,cb)=>{const b=q(id);const upd=v=>{b.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v))};upd(val);b.onclick=e=>{const v=e.target.dataset.v;if(!v)return;upd(v);cb(v)}};
    seg('#s_tipo',d.tipo,v=>{d.tipo=v;d.cat=v==='receita'?'receitas':'alimentacao';d.sub='';fillCat();});
    seg('#s_nat',d.natureza,v=>{d.natureza=v;natTocada=true});
    let natTocada=!novo||!!preset?.natureza;
    q('#l_conta').innerHTML=`<option value="">Pix / dinheiro</option>`+S.contas.map(c=>`<option value="${c.id}">${esc(c.nome)}${c.tipo==='cartao'?' (cartão)':''}</option>`).join('');
    q('#l_conta').value=contaById(d.conta)?d.conta:'';
    function fillCat(){
      const cs=d.tipo==='receita'?[RECEITAS]:CATS;
      q('#l_cat').innerHTML=cs.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
      q('#l_cat').value=d.cat; fillSub();
    }
    function fillSub(){
      const c=catById(d.cat);
      q('#l_sub').innerHTML=c.subs.map(s=>`<option>${esc(s)}</option>`).join('');
      if(!c.subs.includes(d.sub)) d.sub=c.subs[0];
      q('#l_sub').value=d.sub;
      const its=c.itens?S.itens.filter(i=>i.cat===c.id):[];
      q('#w_item').hidden=!c.itens;
      if(c.itens){q('#l_itemlbl').textContent=c.itens[0].toUpperCase()+c.itens.slice(1);
        q('#l_item').innerHTML=(its.length?`<option value="">Geral (não específico)</option>`:`<option value="">Cadastre na aba Família</option>`)+its.map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('');
        q('#l_item').value=its.some(i=>i.id===d.item)?d.item:''; }
      else d.item='';
      autoNat(); parc();
    }
    function autoNat(){if(natTocada)return;d.natureza=(FIXAS.has(d.cat)||FIXAS.has(d.sub))?'fixa':'variavel';q('#s_nat').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===d.natureza))}
    function parc(){const c=contaById(q('#l_conta').value);const show=novo&&c?.tipo==='cartao'&&d.tipo==='despesa';q('#w_parc').hidden=!show;
      const n=+q('#l_parc').value||1, v=parseValor(q('#l_valor').value);
      q('#h_parc').textContent= show&&n>1&&v>0 ? `${n}x de ${brl(v/n)} — uma parcela por mês a partir desta data.` : (show?'Informe o valor total da compra; o app divide nas parcelas.':'');}
    fillCat();
    q('#l_cat').onchange=e=>{d.cat=e.target.value;d.sub='';fillSub()};
    q('#l_sub').onchange=e=>{d.sub=e.target.value;autoNat()};
    q('#l_conta').onchange=parc; q('#l_parc').oninput=parc; q('#l_valor').oninput=parc;
    if(novo) setTimeout(()=>q('#l_valor').focus(),50);

    q('#l_save').onclick=async()=>{
      if(!podeSalvar())return;
      if(!podeLancar()){toast('Seu perfil está como "só acompanha".');return}
      const valor=parseValor(q('#l_valor').value);
      if(!(valor>0)){toast('Informe um valor maior que zero.');q('#l_valor').focus();return}
      const data=q('#l_data').value; if(!data){toast('Informe a data.');return}
      const base={tipo:d.tipo,valor,data,desc:q('#l_desc').value.trim(),cat:d.cat,sub:q('#l_sub').value,item:catById(d.cat).itens?q('#l_item').value:'',conta:q('#l_conta').value,natureza:d.natureza};
      const btn=q('#l_save'); btn.disabled=true; btn.textContent='Salvando…';
      try{
        if(!novo){const {id,...resto}=l; await db.doc('lanc/'+id).set({...resto,...base,editadoPor:S.uid||'',editado:Date.now()})}
        else{
          const n=(!q('#w_parc').hidden&&+q('#l_parc').value>1)?Math.min(36,Math.floor(+q('#l_parc').value)):1;
          const grupo=n>1?'g'+Date.now().toString(36):'';
          const parcela=Math.floor(valor/n*100)/100;
          for(let i=0;i<n;i++){
            const v=i===n-1?Math.round((valor-parcela*(n-1))*100)/100:parcela;
            await db.collection('lanc').add({...base,valor:v,data:addMesData(data,i),desc:n>1?`${base.desc||base.sub} (${i+1}/${n})`:base.desc,grupo,autor:S.uid||'',criado:Date.now()+i});
          }
        }
        lsSet('cf_ultconta',base.conta);
        fechar(); toast(novo?'Lançamento salvo':'Alterações salvas');
      }catch(e){btn.disabled=false;btn.textContent='Salvar';erroEscrita(e)}
    };
    const del=q('#l_del');
    if(del) del.onclick=async()=>{
      if(del.dataset.c!=='1'){del.dataset.c='1';del.textContent='Toque de novo para excluir';return}
      if(!podeSalvar())return;
      try{await db.doc('lanc/'+l.id).delete();fechar();toast('Lançamento excluído')}catch(e){erroEscrita(e)}
    };
    const delg=q('#l_delg');
    if(delg) delg.onclick=async()=>{
      const grupo=S.lanc.filter(x=>x.grupo===l.grupo);
      if(delg.dataset.c!=='1'){delg.dataset.c='1';delg.textContent=`Confirmar: excluir ${grupo.length} parcelas`;return}
      if(!podeSalvar())return;
      try{for(const x of grupo) await db.doc('lanc/'+x.id).delete();fechar();toast('Parcelas excluídas')}catch(e){erroEscrita(e)}
    };
  });
}

function formConta(c,tipo){

async function hashPin(pin){

function lockTecla(k){
  const r=document.getElementById('lockRoot');
  if(k==='esq'){r.querySelector('#lkReset').hidden=false;return}

  if(pinBuf.length===4) verificarPin();

async function verificarPin(){
  const msg=document.getElementById('lkMsg'), dots=document.getElementById('lkDots');
  if(!S.prefs||!S.uid){msg.textContent='Carregando…';setTimeout(()=>{if(lockAberto&&pinBuf.length===4)verificarPin()},500);return}
  if(!S.prefs.pin){marcarDesbloq();fecharLock();return}
  if(await hashPin(pinBuf)===S.prefs.pin){marcarDesbloq();fecharLock();return}
  msg.textContent='PIN incorreto. Tente de novo.'; pinBuf='';
  dots.classList.remove('err'); void dots.offsetWidth; dots.classList.add('err');

}

function assinar(nome){
  let srv=false; const t=setTimeout(()=>{if(!srv){S.slow=true;render()}},10000);
  return db.collection(nome).onSnapshot(snap=>{
    S[nome]=snap.docs.map(d=>({...d.data(),id:d.id}));
    S.loaded[nome]=true;
    if(!snap.metadata.fromCache){srv=true;clearTimeout(t);S.slow=false}
    if(nome==='lanc') refreshNames();
    if(nome==='pessoas'&&S.loaded.pessoas) garantirPessoa();
    render();
  },err=>{clearTimeout(t);S.err=err.code;render()});
}

function gravar(p){return new Promise((res,rej)=>{let ok=false;p.then(()=>{if(!ok){ok=true;res()}},e=>{if(!ok){ok=true;rej(e)}else erroEscrita(e)});setTimeout(()=>{if(!ok){ok=true;res()}},1500)})}
function refDoc(r){return {id:r.id,path:r.path,get:()=>r.get(),onSnapshot:(...x)=>r.onSnapshot(...x),set:d=>gravar(r.set(d)),update:d=>gravar(r.update(d)),delete:()=>gravar(r.delete()),collection:p=>refCol(r.collection(p))}}
function refCol(c){return {onSnapshot:(...x)=>c.onSnapshot(...x),get:()=>c.get(),doc:id=>refDoc(id?c.doc(id):c.doc()),add:d=>{const r=c.doc();return gravar(r.set(d)).then(()=>refDoc(r))}}}

      <button class="lnk" data-au="sair">Sair</button>`
  }[modo];
  r.innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-label="Acesso"><div class="lk-top"><div class="lk-logo"><svg viewBox="0 0 100 100"><path d="M37 74 V28 M26 40 L37 27 L48 40" fill="none" stroke="#4CD39A" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M63 26 V72 M52 60 L63 73 L74 60" fill="none" stroke="#FF7A6B" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>Fluxo da Casa</h2><p>Finanças da família</p></div>
    <form class="auth-box" id="auForm" novalidate>${corpo}</form><span></span></div>`;
  const f=r.querySelector('#auForm'), msg=t=>{const m=r.querySelector('#au_msg');if(m){m.textContent=t;m.style.color='var(--bad)'}};
  if(info) setTimeout(()=>msg(info),0);
  f.addEventListener('submit',e=>{e.preventDefault();const p=f.querySelector('.btn.primary');p&&p.click()});
  f.addEventListener('click',async e=>{
    const b=e.target.closest('[data-au]'); if(!b)return; e.preventDefault();
    const k=b.dataset.au, v=id=>(f.querySelector('#'+id)?.value||'').trim();
    try{
      if(k==='ircriar') mostrarAuth('criar');
      if(k==='irlogin') mostrarAuth('login');
      if(k==='sair') sair();
      if(k==='tentar') entrar(auth.currentUser);
      if(k==='entrar'){b.disabled=true;await auth.signInWithEmailAndPassword(v('au_email'),f.querySelector('#au_senha').value)}
      if(k==='esqueci'){if(!v('au_email')){msg('Digite seu e-mail acima e toque de novo.');return}await auth.sendPasswordResetEmail(v('au_email'));toast('Enviamos um link para trocar a senha.')}
      if(k==='criar'){const s1=f.querySelector('#au_senha').value;if(s1!==f.querySelector('#au_senha2').value){msg('As duas senhas não são iguais.');return}
        b.disabled=true;const c=await auth.createUserWithEmailAndPassword(v('au_email'),s1);await c.user.sendEmailVerification();mostrarAuth('verificar')}
      if(k==='reenviar'){await auth.currentUser.sendEmailVerification();toast('E-mail reenviado.')}
      if(k==='confirmei'){await auth.currentUser.reload();if(!auth.currentUser.emailVerified){msg('Ainda não aparece como confirmado. Toque no link do e-mail e tente de novo.');return}
        await auth.currentUser.getIdToken(true);entrar(auth.currentUser)}
    }catch(err){b.disabled=false;msg(msgAuth(err))}
  });
}
function fecharAuth(){document.getElementById('authRoot').innerHTML=''}
async function sair(){
  lsSet('cf_haspin','');try{sessionStorage.removeItem('cf_unl')}catch(e){}
  if(lockAberto)fecharLock();
  try{await auth.signOut()}catch(e){}
}
async function entrar(u){
  subs.forEach(f=>{try{f()}catch(e){}}); subs=[];
  Object.assign(S,{lanc:[],contas:[],itens:[],pessoas:[],tetos:{},prefs:null,loaded:{},slow:false,err:null,uid:null,isOwner:false,canWrite:true});
  ACESSO=null; S_email='';
  if(!u){S.ready=true;fecharLock();render();mostrarAuth('login');return}
  if(!u.emailVerified){mostrarAuth('verificar');return}
  S_email=(u.email||'').toLowerCase();
  let ac;
  try{ac=await fs.doc('config/acesso').get()}catch(e){mostrarAuth('negado');return}
  if(!ac.exists){
    try{await gravar(fs.doc('config/acesso').set({dono:u.uid,emails:[S_email],somenteVer:[],criado:Date.now()}))}catch(e){mostrarAuth('negado');return}
    toast('Você é o administrador do app.');
  } else if(!(ac.data().emails||[]).includes(S_email)){mostrarAuth('negado');return}
  S.uid=u.uid; S.names[S.uid]=S_email.split('@')[0]; S.ready=true;
  fecharAuth();
  subs.push(fs.doc('config/acesso').onSnapshot(sn=>{
    ACESSO=sn.data()||{}; S.isOwner=ACESSO.dono===S.uid; S.canWrite=!(ACESSO.somenteVer||[]).includes(S_email);
    if(ACESSO.emails&&!ACESSO.emails.includes(S_email)){mostrarAuth('negado');return}
    render();
  },()=>{}));
  ['lanc','contas','itens','pessoas'].forEach(n=>subs.push(assinar(n)));
  subs.push(fs.doc('config/tetos').onSnapshot(sn=>{S.tetos=sn.exists?{...sn.data()}:{};render()},()=>{}));
  subs.push(fs.doc('prefs/'+S.uid).onSnapshot(sn=>{S.prefs=sn.exists?{...sn.data()}:{};aplicarPrefs();render()},()=>{S.prefs={}}));
  render();
}

if(lsGet('cf_haspin')==='1'&&!desbloqueadoRecente()) mostrarLock();
render();
if(!configurado()||!window.firebase){S.ready=true;mostrarAuth('config')}
else{
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth(); fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  db={doc:p=>refDoc(fs.doc(p)),collection:p=>refCol(fs.collection(p))};
  auth.onAuthStateChanged(u=>entrar(u));
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
